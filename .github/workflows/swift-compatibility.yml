name: Swift Compatibility

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: swift-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-6-0:
    name: Swift 6.0 compatibility
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select an iOS simulator
        id: simulator
        run: |
          udid=$(/usr/bin/python3 .github/scripts/latest-iphone-simulator.py)
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test on iOS
        run: >-
          xcodebuild test
          -scheme ILikeToMoveIt
          -destination 'id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO

  current-swift:
    name: Current Swift tests and example app build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select an iOS simulator
        id: simulator
        run: |
          udid=$(/usr/bin/python3 .github/scripts/latest-iphone-simulator.py)
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test on iOS
        run: >-
          xcodebuild test
          -scheme ILikeToMoveIt
          -destination 'id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS
        run: >-
          xcodebuild build
          -scheme ILikeToMoveIt
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build the example app
        run: >-
          xcodebuild build
          -workspace Example/ILikeToMoveIt.xcworkspace
          -scheme 'ILikeToMoveIt Development'
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
